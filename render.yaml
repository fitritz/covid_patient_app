services:
  - type: web
    name: covid-patient-app
    runtime: python
    buildCommand: pip install -r webapp/backend/requirements.txt && cd webapp/frontend && npm ci && npm run build
    startCommand: cd webapp/backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: MONGO_URI
        sync: false
